<!-- @dsCard group="Components" name="Кнопки" subtitle="Coral, ink, ghost" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Кнопки — Реестр</title>
<link rel="stylesheet" href="../_style.css" />
</head>
<body>
  <div class="wrap">
    <p class="label">Components</p>
    <h2 class="h" style="font-size:28px;margin-bottom:24px;">Кнопки</h2>

    <div class="stack" style="gap:28px;">
      <div>
        <p class="muted" style="margin:0 0 12px;font-size:13px;">Основная (coral)</p>
        <div class="row">
          <button class="btn btn-coral">Получить доступ
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="btn btn-coral">Оформить доступ</button>
        </div>
      </div>

      <div>
        <p class="muted" style="margin:0 0 12px;font-size:13px;">Тёмная (ink)</p>
        <div class="row">
          <button class="btn btn-ink">Войти</button>
          <button class="btn btn-ink">Продолжить
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

      <div>
        <p class="muted" style="margin:0 0 12px;font-size:13px;">Текстовая (ghost)</p>
        <div class="row">
          <button class="btn btn-ghost">Как это устроено</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
