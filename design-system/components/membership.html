<!-- @dsCard group="Components" name="Карта членства" subtitle="Тариф и оформление доступа" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Карта членства — Реестр</title>
<link rel="stylesheet" href="../_style.css" />
<style>
  .price { font-family: 'Source Serif 4', serif; font-weight: 500; font-size: 56px; line-height: 1; }
  .check { width: 20px; height: 20px; border-radius: 999px; background: rgba(217,119,87,.12);
    color: var(--coral-ink); display: grid; place-items: center; flex: 0 0 auto; margin-top: 2px; }
  .check svg { width: 13px; height: 13px; }
  .feat { display: flex; gap: 12px; align-items: flex-start; margin: 14px 0; color: var(--ink-soft); }
  .badge { display: inline-flex; align-items: center; border-radius: 999px; background: var(--oat);
    padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
</style>
</head>
<body>
  <div class="wrap" style="max-width:520px;">
    <div class="card" style="padding:36px;">
      <span class="badge">Членство</span>
      <div class="price" style="margin:22px 0 6px;">55 000 ₸</div>
      <p class="muted" style="margin:0;">за 30 дней доступа · продлевается</p>
      <div style="height:1px;background:var(--line);margin:24px 0;"></div>

      <div class="feat"><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 12.5l4.5 4.5L19 6.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Доступ ко всей базе поставщиков</div>
      <div class="feat"><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 12.5l4.5 4.5L19 6.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Еженедельные обновления и проверка</div>
      <div class="feat"><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 12.5l4.5 4.5L19 6.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Вход с двух устройств</div>
      <div class="feat"><span class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M5 12.5l4.5 4.5L19 6.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Персональный водяной знак на контактах</div>

      <button class="btn btn-coral" style="width:100%;justify-content:center;margin-top:22px;padding:16px;">Оформить доступ
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p class="muted" style="text-align:center;font-size:14px;margin:12px 0 0;">Оплата картой · Доступ сразу после оплаты</p>
    </div>
  </div>
</body>
</html>
