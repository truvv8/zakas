<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Форма — Реестр</title>
<link rel="stylesheet" href="../_style.css" />
</head>
<body>
  <div class="wrap" style="max-width:420px;">
    <p class="label">Components</p>
    <h2 class="h" style="font-size:28px;margin-bottom:6px;">Вход в реестр</h2>
    <p class="muted" style="margin:0 0 24px;">Введите почту — пришлём ссылку для входа.</p>

    <label style="display:block;font-size:14px;font-weight:600;color:var(--ink-soft);margin-bottom:8px;">Электронная почта</label>
    <input class="field" type="email" placeholder="you@email.com" />

    <button class="btn btn-coral" style="width:100%;justify-content:center;margin-top:16px;">Получить ссылку для входа</button>
