<!-- @dsCard group="Components" name="Карточки" subtitle="Feature и превью контента" -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Карточки — Реестр</title>
<link rel="stylesheet" href="../_style.css" />
<style>
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .num { font-family: 'Source Serif 4', serif; font-size: 22px; color: var(--coral-ink); }
  .preview-row { display: flex; align-items: center; justify-content: space-between;
    border: 1px solid var(--line-soft); background: rgba(244,241,234,.6); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
  .ava { width: 32px; height: 32px; border-radius: 8px; background: var(--oat); display: grid; place-items: center;
    font-family: 'Source Serif 4', serif; font-size: 14px; color: var(--ink-soft); }
  .blur { filter: blur(5px); user-select: none; }
  @media (max-width: 760px){ .grid2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <p class="label">Components</p>
    <h2 class="h" style="font-size:28px;margin-bottom:24px;">Карточки</h2>

    <div class="grid2">
      <!-- Feature card -->
      <div class="card card-feature">
        <span class="num">01</span>
        <h3 class="h" style="font-size:20px;margin:10px 0 6px;">Прямые контакты</h3>
        <p class="muted" style="margin:0;">Имя, мессенджер и профиль каждого поставщика — без посредников.</p>
      </div>

      <!-- Preview card -->
      <div class="card" style="padding:22px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <span class="h" style="font-size:17px;">База поставщиков</span>
          <span class="tag"><span class="dot"></span>По подписке</span>
        </div>
        <div class="preview-row">
          <div style="display:flex;align-items:center;gap:12px;"><span class="ava">1</span><span>Кожевенная мануфактура</span></div>
          <span class="muted" style="font-size:14px;">92%</span>
        </div>
        <div class="preview-row">
          <div style="display:flex;align-items:center;gap:12px;"><span class="ava">2</span><span class="blur">Контакт скрыт</span></div>
          <span class="muted" style="font-size:14px;">88%</span>
        </div>
        <div class="preview-row" style="margin-bottom:0;">
          <div style="display:flex;align-items:center;gap:12px;"><span class="ava">3</span><span class="blur">Контакт скрыт</span></div>
          <span class="muted" style="font-size:14px;">95%</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
